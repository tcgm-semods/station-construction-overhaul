name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools from tcgm/StarEmpireMM
        run: pip install git+https://github.com/tcgm/StarEmpireMM.git

      - name: Build .semod package
        run: python packaging/build.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.semod'
          generate_release_notes: true
